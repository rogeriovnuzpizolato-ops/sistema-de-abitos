<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Hábitos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Rastreador de Hábitos</h1>

      <section class="add-habit">
        <input
          type="text"
          id="habit-input"
          placeholder="Digite um novo hábito"
        />

        <button id="add-btn">Adicionar</button>
      </section>

      <section id="habit-list">
        <div class="habit-card"></div>
        <div class="habit-actions">
          <button class="complete-btn">Concluir</button>

          <button class="edit-btn">Editar</button>

          <button class="delete-btn">Excluir</button>
        </div>

        <!-- Exemplo -->

        <!--

                <div class="habit-info">
                    <h2>Estudar JavaScript</h2>
                    <p>🔥 Sequência: 5 dias</p>
                </div>

            -->
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
